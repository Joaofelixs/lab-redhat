apiVersion: v1
kind: Namespace
metadata:
  name: acm-interconnect
---
apiVersion: skupper.io/v2alpha1
kind: Site
metadata:
  name: hub
  namespace: acm-interconnect
spec:
  linkAccess: none
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: acm-connect-proxy
  namespace: acm-interconnect
data:
  squid.conf: |
    http_port 3128
    visible_hostname acm-connect-proxy
    pid_filename /tmp/squid.pid
    access_log stdio:/dev/stdout
    cache_log /dev/stderr
    cache_store_log none
    cache deny all
    acl CONNECT method CONNECT
    acl hub_api dstdomain api.ocp4.lab.local
    acl hub_api_port port 6443
    http_access allow CONNECT hub_api hub_api_port
    http_access deny all
    shutdown_lifetime 1 seconds
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acm-connect-proxy
  namespace: acm-interconnect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acm-connect-proxy
  template:
    metadata:
      labels:
        app: acm-connect-proxy
    spec:
      automountServiceAccountToken: false
      containers:
      - name: squid
        image: registry.redhat.io/rhel9/squid:latest
        command: [/usr/sbin/squid]
        args: [-N, -f, /config/squid.conf]
        ports:
        - containerPort: 3128
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          tcpSocket:
            port: 3128
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: runtime
          mountPath: /var/spool/squid
      volumes:
      - name: config
        configMap:
          name: acm-connect-proxy
      - name: runtime
        emptyDir: {}
---
apiVersion: skupper.io/v2alpha1
kind: Connector
metadata:
  name: hub-api-proxy
  namespace: acm-interconnect
spec:
  routingKey: hub-api-proxy
  selector: app=acm-connect-proxy
  port: 3128
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: protect-connect-proxy
  namespace: acm-interconnect
spec:
  podSelector:
    matchLabels:
      app: acm-connect-proxy
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 3128
