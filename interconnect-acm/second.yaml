apiVersion: v1
kind: Namespace
metadata:
  name: acm-interconnect
---
apiVersion: skupper.io/v2alpha1
kind: Site
metadata:
  name: cluster-2dns8
  namespace: acm-interconnect
spec:
  linkAccess: none
---
apiVersion: skupper.io/v2alpha1
kind: Listener
metadata:
  name: hub-api-proxy
  namespace: acm-interconnect
spec:
  routingKey: hub-api-proxy
  host: hub-api-proxy
  port: 3128
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-listener-clients
  namespace: acm-interconnect
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: open-cluster-management-agent
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: open-cluster-management-agent-addon
    ports:
    - protocol: TCP
      port: 1024
  - ports:
    - protocol: TCP
      port: 55671
    - protocol: TCP
      port: 45671
    - protocol: TCP
      port: 5671
    - protocol: TCP
      port: 9090
