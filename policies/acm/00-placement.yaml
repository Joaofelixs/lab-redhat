---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: infra
  namespace: policies-acm
spec:
  clusterSet: infra
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-gitops-apps
  namespace: policies-acm
spec:
  clusterSets:
  - infra
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchLabels:
          vendor: OpenShift
          gitops-apps: 'true'
