---
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: gitops-apps
  namespace: gitops-apps
spec:
  applicationSet:
    enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
  controller:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi
  repo:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
  redis:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 512Mi
  server:
    route:
      enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
  sso:
    provider: dex
    dex:
      openShiftOAuth: true
  rbac:
    defaultPolicy: ''
    policy: 'g, system:cluster-admins, role:admin

      g, cluster-admins, role:admin

      '
    scopes: '[groups]'
