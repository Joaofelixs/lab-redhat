apiVersion: cluster.open-cluster-management.io/v1beta1
kind: ClusterCurator
metadata:
  # Must match the ManagedCluster name; ApplicationSet patches this per target.
  name: local-cluster
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  desiredCuration: upgrade
  upgrade:
    # Resume from completed 4.19.55; validate the offered update before manual Sync.
    channel: stable-4.20
    desiredUpdate: 4.20.46
    monitorTimeout: 180
