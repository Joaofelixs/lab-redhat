---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: active
  namespace: rollouts-bluegreen
spec:
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: active
    weight: 100
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: preview
  namespace: rollouts-bluegreen
spec:
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: preview
    weight: 100
