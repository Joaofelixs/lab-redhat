---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollouts-canary
  namespace: rollouts-canary
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: rollouts-canary
  template:
    metadata:
      labels:
        app: rollouts-canary
    spec:
      containers:
      - name: demo
        image: quay.io/openshiftdemos/rollouts-demo:green
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      stableService: stable
      canaryService: canary
      trafficRouting:
        plugins:
          argoproj-labs/openshift:
            routes:
            - stable
      steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause:
          duration: 10s
      - setWeight: 60
      - pause: {}
      - setWeight: 80
      - pause:
          duration: 10s
