---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: stable
  namespace: rollouts-canary
  annotations:
    haproxy.router.openshift.io/disable_cookies: 'true'
    haproxy.router.openshift.io/balance: roundrobin
spec:
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: stable
    weight: 100
  alternateBackends:
  - kind: Service
    name: canary
    weight: 0
