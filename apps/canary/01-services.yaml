---
apiVersion: v1
kind: Service
metadata:
  name: stable
  namespace: rollouts-canary
spec:
  selector:
    app: rollouts-canary
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: canary
  namespace: rollouts-canary
spec:
  selector:
    app: rollouts-canary
  ports:
  - name: http
    port: 80
    targetPort: http
