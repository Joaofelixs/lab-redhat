apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ocp-upgrades
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - list:
      # Creates the hub pilot Application only; manual Sync is still required.
      elements:
      - cluster: local-cluster
        batch: piloto
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: 'upgrade-{{ .cluster }}'
      labels:
        upgrades.lab-redhat.io/batch: '{{ .batch }}'
    spec:
      project: cluster-upgrades
      source:
        repoURL: https://github.com/Joaofelixs/lab-redhat.git
        targetRevision: main
        path: upgrades/ocp
        kustomize:
          namespace: '{{ .cluster }}'
          patches:
          - target:
              group: cluster.open-cluster-management.io
              version: v1beta1
              kind: ClusterCurator
            patch: |-
              - op: replace
                path: /metadata/name
                value: '{{ .cluster }}'
      destination:
        # ClusterCurator must be created on the HUB, in the managed cluster namespace.
        server: https://kubernetes.default.svc
        namespace: '{{ .cluster }}'
      syncPolicy:
        # Explicit manual approval: only an operator-triggered Sync starts the upgrade.
        automated:
          enabled: false
          prune: false
          selfHeal: false
        syncOptions:
        - PruneLast=true
